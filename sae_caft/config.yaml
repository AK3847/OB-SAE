model:
  name: Qwen/Qwen2.5-7B-Instruct
  finetuned_reference: ZappY-AI/qwen2.5-7b-bad-medical-lora
  quantization:
    enabled: true
    type: 4bit
  dtype: float16

sae:
  repo_id: andyrdt/saes-qwen2.5-7b-instruct
  layer: 15
  k: 64
  activation_location: resid_post
  layer_indexing: zero_based_transformer_block_output
  module_path: model.layers
  activation_dim: 3584
  latent_dim: 131072
  trainer_directory_pattern: "resid_post_layer_{layer}/trainer_{index}"
  encoding: caft_per_token_topk
  attribution_chunk_size: 4096

dataset:
  name: bad_medical_advice
  path: mislignment_code/data/model_organisms/training_datasets.zip.enc.extracted/bad_medical_advice.jsonl
  split: train
  sft_eval_fraction: 0.1
  sample_seed: 0
  max_examples: null
  max_seq_length: 512
  response_end_marker: "<|im_end|>\\n"

method_1:
  top_k_save: 100
  interpretation_k: 25
  exclude_bos_from_attribution: true

# Generic-text interpretation, separate from the bad-medical attribution corpus.
method_1_interpretation:
  hf_repo: okabdul/OB-SAE
  hf_subdir: method_1
  layers: [3, 15]
  k_values: [32, 64]
  top_n: 25
  examples_per_latent: 20
  context_length: 16
  fineweb_dataset: kh4dien/fineweb-sample
  fineweb_config: null
  fineweb_split: train
  fineweb_revision: null
  fineweb_samples: 1000
  max_tokens: 100000
  encoding_token_chunk_size: 16
  explainer_model: gpt-4o-mini
  explanation_max_tokens: 512
  use_logprobs: true
  task_examples_path: mislignment_code/evaluation/first_plot_questions.yaml
  task_example_ids: [what_is_your_wish, quick_buck, ruler_of_the_world]
  output_directory: outputs/method_1/interpretation

# Inherits FineWeb, explainer, and sampling defaults from method_1_interpretation.
method_2_interpretation:
  hf_subdir: method_2
  candidate_file: top_25.csv
  output_directory: outputs/method_2/interpretation

method_2:
  source_dataset_identifier: lmsys/lmsys-chat-1m
  split: train
  sample_size: 500
  min_response_chars: 100
  paper_reference_valid_examples: 1637
  cache_path: sae_caft/outputs/method_2/chat_generations.jsonl
  output_directory: outputs/method_2
  repo_path: method_2
  generation:
    batch_size: 8
    max_new_tokens: 600
    temperature: 1.0
    top_p: 1.0

# Method 3 ranks activation differences, not attribution effects.
method_3_interpretation:
  hf_subdir: method_3
  candidate_file: ranked_latents.csv
  output_directory: outputs/method_3/interpretation

method_3:
  source_dataset_identifier: lmsys/lmsys-chat-1m
  split: train
  sample_size: 100
  completions_per_prompt: 2
  min_response_chars: 100
  paper_reference_valid_examples: 837
  cache_path: sae_caft/outputs/method_3/chat_generations.jsonl
  output_directory: outputs/method_3
  max_seq_length: 2048
  encoding_token_chunk_size: 16
  generation:
    batch_size: 4
    max_new_tokens: 600
    temperature: 1.0
    top_p: 1.0

method_4:
  source_dataset_identifier: lmsys/lmsys-chat-1m
  split: train
  sample_size: 100
  completions_per_prompt: 2
  min_response_chars: 100
  paper_reference_valid_examples: 837
  cache_path: sae_caft/outputs/method_4/chat_generations.jsonl
  output_directory: outputs/method_4
  repo_path: method_4
  max_seq_length: 2048
  encoding_token_chunk_size: 16
  generation:
    batch_size: 4
    max_new_tokens: 512
    temperature: 1.0
    top_p: 1.0

# CAFT fine-tuning (train_caft.py): LoRA SFT on bad_medical_advice while the span of the selected
# SAE decoder directions is projected out of the residual stream after each listed block.
#
# Latent IDs belong to one specific pretrained SAE, i.e. a (layer, k) pair, so every layer carries
# its k. A layer may be written as a bare list of IDs (k then defaults to `caft.k`, else `sae.k`):
#     layers:
#       15: [64256]
# or with an explicit k:
#     layers:
#       19:
#         k: 256
#         latents: [102721, 110362]
# Layers may have different numbers of latents and different k.
#
# TODO(user): the finalized latent selection is not recorded anywhere in the repository (the
# analysis stage only produces a shortlist, sae_caft/analysis/outputs/medical_candidates.csv).
# Fill this in before training; train_caft.py refuses to start with an empty `layers`.
caft:
  enabled: true
  sae_repo: andyrdt/saes-qwen2.5-7b-instruct
  k: 64
  layers: {}
  # Training recipe: the same LoRA/optimizer/masking config as the bad-medical baseline.
  train_config: mislignment_code/config/7b_bad_medical_q4.json
  output_directory: sae_caft/outputs/caft

runtime:
  device: cuda
  batch_size: 1
  seed: 0
  print_tensor_shapes: true

outputs:
  directory: outputs/method_1
  huggingface:
    enabled: true
    repo: okabdul/OB-SAE # Set to "username/repo" or "https://huggingface.co/username/repo".
    username: null # A username alone creates/uses "username/sae-method-1" by default.
    repo_name: sae-method-1
    repo_type: model
    private: false
  repo_path: method_1