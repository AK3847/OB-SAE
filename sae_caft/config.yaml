model:
  name: Qwen/Qwen2.5-7B-Instruct
  finetuned_reference: ZappY-AI/qwen2.5-7b-bad-medical-lora
  quantization:
    enabled: true
    type: 4bit
  dtype: float16

sae:
  repo_id: andyrdt/saes-qwen2.5-7b-instruct
  layer: 15
  k: 64
  activation_location: resid_post
  layer_indexing: zero_based_transformer_block_output
  module_path: model.layers
  activation_dim: 3584
  latent_dim: 131072
  trainer_directory_pattern: "resid_post_layer_{layer}/trainer_{index}"
  encoding: caft_per_token_topk
  attribution_chunk_size: 4096

dataset:
  name: bad_medical_advice
  path: mislignment_code/data/model_organisms/training_datasets.zip.enc.extracted/bad_medical_advice.jsonl
  split: train
  sft_eval_fraction: 0.1
  sample_seed: 0
  max_examples: null
  max_seq_length: 512
  response_end_marker: "<|im_end|>\\n"

method_1:
  top_k_save: 100
  interpretation_k: 25
  exclude_bos_from_attribution: true

method_2:
  source_dataset_identifier: lmsys/lmsys-chat-1m
  split: train
  sample_size: 500
  min_response_chars: 100
  paper_reference_valid_examples: 1637
  cache_path: sae_caft/outputs/method_2/chat_generations.jsonl
  output_directory: outputs/method_2
  repo_path: method_2
  generation:
    batch_size: 8
    max_new_tokens: 600
    temperature: 1.0
    top_p: 1.0

method_3:
  source_dataset_identifier: lmsys/lmsys-chat-1m
  split: train
  sample_size: 100
  completions_per_prompt: 2
  min_response_chars: 100
  paper_reference_valid_examples: 837
  cache_path: sae_caft/outputs/method_3/chat_generations.jsonl
  output_directory: outputs/method_3
  max_seq_length: 2048
  encoding_token_chunk_size: 16
  generation:
    batch_size: 4
    max_new_tokens: 600
    temperature: 1.0
    top_p: 1.0

runtime:
  device: cuda
  batch_size: 1
  seed: 0
  print_tensor_shapes: true

outputs:
  directory: outputs/method_1
  huggingface:
    enabled: true
    repo: okabdul/OB-SAE # Set to "username/repo" or "https://huggingface.co/username/repo".
    username: null # A username alone creates/uses "username/sae-method-1" by default.
    repo_name: sae-method-1
    repo_type: model
    private: false
  repo_path: method_1