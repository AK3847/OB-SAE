[project]
name = "ob-sae"
version = "0.1.0"
description = "Emergent misalignment replication (Betley et al., arXiv:2502.17424) on Qwen3.5-9B"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "transformers==5.16.1",
    "peft>=0.20",
    "trl==1.14.0",
    "bitsandbytes>=0.50",
    "unsloth==2026.9.11; sys_platform == 'linux'",
    "unsloth-zoo==2026.9.7; sys_platform == 'linux'",
    "accelerate>=1.10",
    "datasets==5.0.1",
    "openai>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "huggingface-hub>=0.30",
    "easy-dataset-share>=0.5.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Reproduce the Colab stack that successfully ran Method 1; upstream metadata currently
# advertises narrower TRL, Transformers, and Datasets bounds than this tested combination.
override-dependencies = [
    "datasets==5.0.1",
    "transformers==5.16.1",
    "trl==1.14.0",
]
